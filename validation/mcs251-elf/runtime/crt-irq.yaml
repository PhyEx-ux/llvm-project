# crt-irq.yaml - pure ELF32/MSB/ET_REL MCS251 IRQ-mode crt fixture (T08).
#
# ISR-campaign replacement startup for links that register real handlers
# through .mcs251.isr records (ISR-TASK-BREAKDOWN.md A3). It provides NO VECS:
# in IRQ mode lld synthesizes the only vector table from .mcs251.isr inputs and
# rejects any input VECS (A3.6/T07), so this asset carries only:
#
#   .mcs251.HOME   3-byte ljmp reset trampoline (J16 -> __mcs251_selfstart_boot)
#   .mcs251.BOOT   frozen startup flow + the reusable XINIT walker + the
#                  4-byte IRQ default fail-stop entry
#   .mcs251.BSEG_BYTES  16-byte writable NOBITS reservation through which the
#                  new CRT owns the bit-addressable byte window [0x20,0x30)
#                  (T08 step 6); lld registers the section in its BSEG_BYTES
#                  region accounting (writable NOBITS only) and allocates it
#                  at the fixed 0x20-0x2F window (SPEC 4.1/5.2), so the
#                  reservation is declared to the linker, not just cleared
#                  by BOOT code. ET_REL sh_addr stays 0; the 0x20 base comes
#                  from the frozen link-time allocation rule.
#   .mcs251.isr    two 24-byte metadata records, asset_profile=1 (A3.2/A3.3):
#                    IRQ_DEFAULT (kind 3, entry_kind 2 IRQ_STOP)  -> default entry
#                    IRQ_RESET   (kind 4, entry_kind 3 RESET)     -> HOME reset
#                  each record carries a four-byte zero symbol_reference
#                  associated by exactly one R_MCS251_ISR_REF (A3.4) at
#                  r_offset = record_offset + 12.
#
# Machine-byte evidence:
#   clr EA          = C2 AF            (bit opcode C2, EA = IE.7 = 0xAF;
#                                       identical bytes to the frozen A5
#                                       default-entry word)
#   mov direct,#imm = 75 <dir> <imm>   (crt-selfstart.lst lines 70/80:
#                                       WTST=0xE9, SBUF=0x99)
#   PSW = 0xD0, DPS = 0xE3             (T08 card step 3 freezes both encodings)
#   ljmp            = 02 + J16 field   (crt-selfstart.lst line 46; SPEC 7.2)
#   ecall           = 9A + addr24      (crt-selfstart.lst lines 78-79;
#                                       QEMU-verified, runtime/README.md)
#   sjmp self       = 80 FE            (crt-selfstart.lst line 82)
#   XINIT walker    = 86 bytes reused verbatim from the frozen crt-selfstart
#                       BOOT[0x14,0x6A) (ground truth:
#                       selfstart-smoke/build/crt-selfstart.lst 0x14-0x69);
#                       all four relocations were recomputed for the walker's
#                       BOOT offset 0x4A: MID8@0x4C, LO8@0x4D, HI8@0x51,
#                       R_MCS251_16@0x54. Internal relative branches
#                       (je/sjmp 0x43/0x09/0xC7/0xF1/0xEA) are position
#                       independent and stay inside the moved block; the
#                       trailing ERET (lst line 125) is the walker's legitimate
#                       ECALL return, reached only via the BOOT ecall below.
#   XDATA walker    = 98 bytes (X4) from crt-xdata-init-walker.asm (sdas251
#                       gold listing; every instruction appears there with its
#                       encoding). BOOT offset 0xA0, relocations MID8@0xA2,
#                       LO8@0xA3, HI8@0xA7, R_MCS251_16@0xAA. Internal
#                       relative branches (je/sjmp 0x4F/0x15/0xBA/0xEB/0xB2/
#                       0xF3) are position independent. Consumes the
#                       .mcs251.xdata_init v1 records (DESIGN-SUPPLEMENT
#                       section 7): per record DPXL <- bank (7A E1 84, the
#                       MOV8dpxl family), DPH:DPL <- window (7A 81 83 /
#                       7A 91 82), payload via movx @dptr,a (F0) + inc dptr
#                       (A3), payload_size == 0 zeroes object_size bytes via
#                       clr a (E4) + movx. Records never straddle a 64K
#                       window (lld gate) so there is no bank-carry handling;
#                       the walker performs no format validation (the lld
#                       validateXDATAInit() gate owns that). DPXL is NOT
#                       restored afterwards: DESIGN-SUPPLEMENT section 3
#                       rules CRT startup has no DPXL obligation (self-healing
#                       sequences reload it before every movx).
#   default entry   = C2 AF 80 FE      (A5 frozen: clr EA; sjmp halt;
#                                       STT_FUNC size 4, no relocation inside,
#                                       no call/push/return, no RETI)
#
# Deliberately NOT carried over from the old BOOT (T08 card: no old default
# prints, no new WTST/board-clock policy):
#   - mov WTST,#0          (board WTST policy is out of scope)
#   - mov SBUF,#'S' / #'!' (old serial markers; main-return is a bare no-stack
#                           halt, the default entry is the frozen 4-byte word)
#   - the eight VECS fragments
#
# BOOT layout (262 = 0x106 bytes, section-relative offsets):
#   0x00 C2 AF        clr EA                       (__mcs251_selfstart_boot)
#   0x02 75 D0 00     mov PSW,#0
#   0x05 75 E3 00     mov DPS,#0
#   0x08 7E F8 00 00  mov spx,#__mcs251_stack_base (R_MCS251_16 @0x0A)
#   0x0C 75 20 00 x16 mov 0x20,#0 .. mov 0x2F,#0   (BSEG_BYTES clear, then
#                                                     the XINIT walker may
#                                                     overwrite byte 0x20-0x2F
#                                                     targets; T08 step 6;
#                                                     the 16B window itself is
#                                                     declared by the writable
#                                                     NOBITS .mcs251.BSEG_BYTES
#                                                     section below)
#   0x3C 9A 00 00 00  ecall __mcs251_globals_init  (R_MCS251_24 @0x3D)
#   0x40 9A 00 00 00  ecall __mcs251_xdata_init    (R_MCS251_24 @0x41; X4)
#   0x44 9A 00 00 00  ecall _main                  (R_MCS251_24 @0x45)
#   0x48 80 FE        sjmp self                    (__mcs251_halt; no stack)
#   0x4A [86B]        XINIT walker                 (__mcs251_globals_init)
#   0xA0 [98B]        XDATA_INIT walker            (__mcs251_xdata_init; X4)
#   0x102 C2 AF 80 FE IRQ default entry            (__mcs251_isr_unhandled)
#
# Normal interrupts stay masked (clr EA only, never setb EA) and NMI is left
# untouched, matching the reset premise (T08 step 4); no IP/IPH initialization
# anywhere.
#
# Reloc offsets are field starts inside their section (byte after the opcode,
# or after the 7E-subop byte for the two 7E forms), matching SPEC 7.1/7.2 and
# the old crt fixture. All fields are zero placeholders; addresses come from
# lld at link time. Area bases (HOME 0xff0000, BOOT >= 0xff0210, XINIT
# 0xff8000) are link parameters (--area-start), never encoded here (SPEC 3.1);
# the BOOT asset itself defaults to 0xff0210 via the link (T07 step 11).
#
# Build with gen-crt-irq.sh (caller-supplied frozen yaml2obj/llvm-readobj);
# independently checked by check-crt-irq.py. The old crt-selfstart assets are
# frozen and untouched.
--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: ELFDATA2MSB
  Type: ET_REL
  Machine: EM_MCS251
  Flags: [ EF_MCS251_ABI_V1 ]
Sections:
  # HOME: reset trampoline. ljmp __mcs251_selfstart_boot (3 bytes; T07 requires
  # HOME to be exactly a 3-byte J16 to the paired BOOT, never a 4-byte EJMP).
  - Name: .mcs251.HOME
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '020000'
  # BOOT: startup flow + reusable XINIT walker + XDATA_INIT walker + IRQ
  # default entry, 0x106 bytes.
  - Name: .mcs251.BOOT
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: ''
  # T08 step 6 (frozen): the new CRT owns a 16-byte BSEG_BYTES reservation for
  # the bit-addressable byte window at 0x20-0x2F. Writable NOBITS per the
  # BSEG_BYTES section contract (SPEC 4.1; lld LinkerCore accepts exactly
  # SHT_NOBITS with ALLOC|WRITE and allocates Region BSEG_BYTES inside the
  # fixed [0x20,0x2f] window), size 16 covers that window exactly. Alignment 1
  # and the plain ".mcs251.BSEG_BYTES" name follow the existing BSEG_BYTES
  # input-section precedent (lld/test/MCS251/reserved-symbols.test). ET_REL
  # sh_addr stays 0 - the 0x20 base is the frozen link-time allocation rule,
  # and it matches the 16 BOOT "mov 0xNN,#0" clears (0x20..0x2F) above. This
  # CRT carries no .mcs251.xinit section of its own (no explicit bit-byte
  # initial values here): link-time XINIT records targeting these bytes are
  # applied by the walker ecall that runs strictly after the clear, i.e. the
  # "clear first, explicit XINIT values overwrite afterwards" order of
  # T08 step 6. No s_BSEG_BYTES/l_BSEG_BYTES symbol is defined here (both are
  # lld-synthesized; user definitions are rejected).
  - Name: .mcs251.BSEG_BYTES
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_WRITE ]
    AddressAlign: 1
    Size: 16
  # New ISR metadata: exactly two asset records for this CRT object, no ALLOC,
  # no address payload. All fields big-endian (A3.2):
  #   protocol_version=0001  record_size=0018
  #   IRQ_DEFAULT: kind=03 entry=02 hw=01 save=00 slot=FFFF caps=0001
  #                symbol_reference=00000000 (R_MCS251_ISR_REF) asset=00000001
  #                reserved=00000000
  #   IRQ_RESET:   kind=04 entry=03 hw=00 save=00 slot=FFFF caps=0001
  #                symbol_reference=00000000 (R_MCS251_ISR_REF) asset=00000001
  #                reserved=00000000
  - Name: .mcs251.isr
    Type: SHT_PROGBITS
    Flags: [ ]
    AddressAlign: 4
    Content: '0001001803020100FFFF00010000000000000001000000000001001804030000FFFF0001000000000000000100000000'
  - Name: .rela.mcs251.HOME
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.HOME
    Relocations:
      # ljmp __mcs251_selfstart_boot: 02 [J16]
      - Offset: 0x1
        Type: R_MCS251_J16
        Symbol: __mcs251_selfstart_boot
        Addend: 0
  - Name: .rela.mcs251.BOOT
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.BOOT
    Relocations:
      # mov spx,#__mcs251_stack_base: 7E F8 [imm16]; lld synthesizes the ABS
      # stack base (SPEC 6.3) because this object carries the UNDEF request.
      - Offset: 0xA
        Type: R_MCS251_16
        Symbol: __mcs251_stack_base
        Addend: 0
      # ecall __mcs251_globals_init: 9A [addr24]
      - Offset: 0x3D
        Type: R_MCS251_24
        Symbol: __mcs251_globals_init
        Addend: 0
      # ecall __mcs251_xdata_init (X4): 9A [addr24]
      - Offset: 0x41
        Type: R_MCS251_24
        Symbol: __mcs251_xdata_init
        Addend: 0
      # ecall _main: 9A [addr24]
      - Offset: 0x45
        Type: R_MCS251_24
        Symbol: _main
        Addend: 0
      # walker hand-prologue: mov wr8,#<s_XINIT mid/lo>: 7E 08 [MID8] [LO8]
      - Offset: 0x4C
        Type: R_MCS251_MID8
        Symbol: s_XINIT
        Addend: 0
      - Offset: 0x4D
        Type: R_MCS251_LO8
        Symbol: s_XINIT
        Addend: 0
      # mov r12,#<s_XINIT hi>: 7A 0C 00 [HI8] (dr0 24-bit bank byte)
      - Offset: 0x51
        Type: R_MCS251_HI8
        Symbol: s_XINIT
        Addend: 0
      # mov wr4,#l_XINIT: 7E 24 [imm16]
      - Offset: 0x54
        Type: R_MCS251_16
        Symbol: l_XINIT
        Addend: 0
      # XDATA_INIT walker prologue (walker at 0xA0):
      # mov dr0[15:0],#<s_XDATA_INIT window>: 7E 08 [MID8] [LO8]
      - Offset: 0xA2
        Type: R_MCS251_MID8
        Symbol: s_XDATA_INIT
        Addend: 0
      - Offset: 0xA3
        Type: R_MCS251_LO8
        Symbol: s_XDATA_INIT
        Addend: 0
      # mov dr0[31:16],#0x00<bank>: 7A 0C 00 [HI8]
      - Offset: 0xA7
        Type: R_MCS251_HI8
        Symbol: s_XDATA_INIT
        Addend: 0
      # mov wr4,#l_XDATA_INIT: 7E 24 [imm16]
      - Offset: 0xAA
        Type: R_MCS251_16
        Symbol: l_XDATA_INIT
        Addend: 0
  - Name: .rela.mcs251.isr
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.isr
    Relocations:
      # IRQ_DEFAULT record @0: zero-width symbol association, r_offset=0+12.
      - Offset: 0xC
        Type: R_MCS251_ISR_REF
        Symbol: __mcs251_isr_unhandled
        Addend: 0
      # IRQ_RESET record @24: r_offset=24+12. Precise named STT_FUNC symbols,
      # never section+addend (A3.4).
      - Offset: 0x24
        Type: R_MCS251_ISR_REF
        Symbol: __mcs251_reset
        Addend: 0
  # Exactly one ABI note per object (SPEC 3.2): namesz=7 descsz=32 type=1,
  # owner "MCS251", eight BE u32 descriptor words.
  - Name: .note.mcs251.abi
    Type: SHT_NOTE
    AddressAlign: 4
    Notes:
      - Name: MCS251
        Type: 1
        Desc: '000000010000000100000000000000020000F3FF000000070000000000000000'
Symbols:
  # Reset entry: named STT_FUNC in executable PROGBITS so the IRQ_RESET record
  # association points at a precise in-object function of range 3 (A3.4).
  - Name: __mcs251_reset
    Type: STT_FUNC
    Binding: STB_GLOBAL
    Section: .mcs251.HOME
    Value: 0x0
    Size: 3
  # IRQ default fail-stop entry: STT_FUNC size 4 (A5); no relocation may fall
  # inside [0x102,0x106); checked byte-exactly by check-crt-irq.py.
  - Name: __mcs251_isr_unhandled
    Type: STT_FUNC
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x102
    Size: 4
  # BOOT entry (HOME J16 target) and XINIT walker (keeps the SPEC 6.2
  # __mcs251_globals_init-defined validation trigger of the v1 chain).
  - Name: __mcs251_selfstart_boot
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x0
  - Name: __mcs251_globals_init
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x4A
  # XDATA_INIT walker entry (X4), ECALLed between globals_init and _main.
  - Name: __mcs251_xdata_init
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0xA0
  # Local labels mirroring the frozen walker asset (crt-selfstart.lst) and
  # the X4 walker asset (crt-xdata-init-walker.asm).
  - Name: __mcs251_halt
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x48
  - Name: __mcs251_xinit_record
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x56
  - Name: __mcs251_xinit_clear
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x7A
  - Name: __mcs251_xinit_copy
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x89
  - Name: __mcs251_xinit_done
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x9F
  - Name: __mcs251_xdata_record
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xAC
  - Name: __mcs251_xdata_copy
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xDF
  - Name: __mcs251_xdata_zero
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xF4
  - Name: __mcs251_xdata_done
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x101
  # Undefined globals resolved by lld: module entry, synthesized stack base,
  # synthesized XINIT/XDATA_INIT boundary symbols (SPEC 6.1/6.3; X4).
  - Name: _main
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: __mcs251_stack_base
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: s_XINIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: l_XINIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: s_XDATA_INIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: l_XDATA_INIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
