# crt-irq-v2.yaml - v2-identity twin of crt-irq.yaml (A4 W7, design 6).
#
# HOME reset trampoline, BOOT startup flow (BSEG_BYTES clear + ECALLs +
# XINIT/XDATA walkers + IRQ default entry), the 16-byte BSEG_BYTES
# reservation, the two 24-byte .mcs251.isr asset records, and every
# relocation/symbol are preserved byte-for-byte from the frozen v1 fixture
# crt-irq.yaml.  The ISR metadata ProtocolVersion stays 1: the ISR record
# protocol and the ELF object identity are two different protocols, and the
# ISR protocol bump belongs to the G1 campaign, not to A4 (W7 card).
#
# The ONLY changes are the object identity:
#   - e_flags 0x00000102, installed by gen-crt-v2.sh after yaml2obj
#     (yaml2obj registers only EF_MCS251_ABI_V1 for EM_MCS251; the YAML
#     below still says EF_MCS251_ABI_V1 and the generator patches ELF
#     header offset 36 - same technique as lld/test/MCS251/
#     v2-object-identity.test setflags.py);
#   - the v1 .note.mcs251.abi is REPLACED by exactly one .mcs251.attributes
#     carrier (172 bytes, byte-exact llc XSmall production emission).
# A v2 object must never also carry the v1 note (design 3.2/4.2).  Checked
# byte-exactly by check-crt-v2.py.
#
# The v1 assets (crt-irq.yaml) stay frozen and untouched.
# Build with gen-crt-v2.sh --identity v2 (caller-supplied frozen
# yaml2obj/llvm-readobj, explicit --out; never writes into the repository).
--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: ELFDATA2MSB
  Type: ET_REL
  Machine: EM_MCS251
  Flags: [ EF_MCS251_ABI_V1 ]
Sections:
  # HOME: reset trampoline. ljmp __mcs251_selfstart_boot (3 bytes; T07 requires
  # HOME to be exactly a 3-byte J16 to the paired BOOT, never a 4-byte EJMP).
  - Name: .mcs251.HOME
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '020000'
  # BOOT: startup flow + reusable XINIT walker + XDATA_INIT walker + IRQ
  # default entry, 0x106 bytes.
  - Name: .mcs251.BOOT
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: ''
  # T08 step 6 (frozen): the new CRT owns a 16-byte BSEG_BYTES reservation for
  # the bit-addressable byte window at 0x20-0x2F. Writable NOBITS per the
  # BSEG_BYTES section contract (SPEC 4.1; lld LinkerCore accepts exactly
  # SHT_NOBITS with ALLOC|WRITE and allocates Region BSEG_BYTES inside the
  # fixed [0x20,0x2f] window), size 16 covers that window exactly. Alignment 1
  # and the plain ".mcs251.BSEG_BYTES" name follow the existing BSEG_BYTES
  # input-section precedent (lld/test/MCS251/reserved-symbols.test). ET_REL
  # sh_addr stays 0 - the 0x20 base is the frozen link-time allocation rule,
  # and it matches the 16 BOOT "mov 0xNN,#0" clears (0x20..0x2F) above. This
  # CRT carries no .mcs251.xinit section of its own (no explicit bit-byte
  # initial values here): link-time XINIT records targeting these bytes are
  # applied by the walker ecall that runs strictly after the clear, i.e. the
  # "clear first, explicit XINIT values overwrite afterwards" order of
  # T08 step 6. No s_BSEG_BYTES/l_BSEG_BYTES symbol is defined here (both are
  # lld-synthesized; user definitions are rejected).
  - Name: .mcs251.BSEG_BYTES
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_WRITE ]
    AddressAlign: 1
    Size: 16
  # New ISR metadata: exactly two asset records for this CRT object, no ALLOC,
  # no address payload. All fields big-endian (A3.2):
  #   protocol_version=0001  record_size=0018
  #   IRQ_DEFAULT: kind=03 entry=02 hw=01 save=00 slot=FFFF caps=0001
  #                symbol_reference=00000000 (R_MCS251_ISR_REF) asset=00000001
  #                reserved=00000000
  #   IRQ_RESET:   kind=04 entry=03 hw=00 save=00 slot=FFFF caps=0001
  #                symbol_reference=00000000 (R_MCS251_ISR_REF) asset=00000001
  #                reserved=00000000
  - Name: .mcs251.isr
    Type: SHT_PROGBITS
    Flags: [ ]
    AddressAlign: 4
    Content: '0001001803020100FFFF00010000000000000001000000000001001804030000FFFF0001000000000000000100000000'
  - Name: .rela.mcs251.HOME
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.HOME
    Relocations:
      # ljmp __mcs251_selfstart_boot: 02 [J16]
      - Offset: 0x1
        Type: R_MCS251_J16
        Symbol: __mcs251_selfstart_boot
        Addend: 0
  - Name: .rela.mcs251.BOOT
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.BOOT
    Relocations:
      # mov spx,#__mcs251_stack_base: 7E F8 [imm16]; lld synthesizes the ABS
      # stack base (SPEC 6.3) because this object carries the UNDEF request.
      - Offset: 0xA
        Type: R_MCS251_16
        Symbol: __mcs251_stack_base
        Addend: 0
      # ecall __mcs251_globals_init: 9A [addr24]
      - Offset: 0x3D
        Type: R_MCS251_24
        Symbol: __mcs251_globals_init
        Addend: 0
      # ecall __mcs251_xdata_init (X4): 9A [addr24]
      - Offset: 0x41
        Type: R_MCS251_24
        Symbol: __mcs251_xdata_init
        Addend: 0
      # ecall _main: 9A [addr24]
      - Offset: 0x45
        Type: R_MCS251_24
        Symbol: _main
        Addend: 0
      # walker hand-prologue: mov wr8,#<s_XINIT mid/lo>: 7E 08 [MID8] [LO8]
      - Offset: 0x4C
        Type: R_MCS251_MID8
        Symbol: s_XINIT
        Addend: 0
      - Offset: 0x4D
        Type: R_MCS251_LO8
        Symbol: s_XINIT
        Addend: 0
      # mov r12,#<s_XINIT hi>: 7A 0C 00 [HI8] (dr0 24-bit bank byte)
      - Offset: 0x51
        Type: R_MCS251_HI8
        Symbol: s_XINIT
        Addend: 0
      # mov wr4,#l_XINIT: 7E 24 [imm16]
      - Offset: 0x54
        Type: R_MCS251_16
        Symbol: l_XINIT
        Addend: 0
      # XDATA_INIT walker prologue (walker at 0xA0):
      # mov dr0[15:0],#<s_XDATA_INIT window>: 7E 08 [MID8] [LO8]
      - Offset: 0xA2
        Type: R_MCS251_MID8
        Symbol: s_XDATA_INIT
        Addend: 0
      - Offset: 0xA3
        Type: R_MCS251_LO8
        Symbol: s_XDATA_INIT
        Addend: 0
      # mov dr0[31:16],#0x00<bank>: 7A 0C 00 [HI8]
      - Offset: 0xA7
        Type: R_MCS251_HI8
        Symbol: s_XDATA_INIT
        Addend: 0
      # mov wr4,#l_XDATA_INIT: 7E 24 [imm16]
      - Offset: 0xAA
        Type: R_MCS251_16
        Symbol: l_XDATA_INIT
        Addend: 0
  - Name: .rela.mcs251.isr
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.isr
    Relocations:
      # IRQ_DEFAULT record @0: zero-width symbol association, r_offset=0+12.
      - Offset: 0xC
        Type: R_MCS251_ISR_REF
        Symbol: __mcs251_isr_unhandled
        Addend: 0
      # IRQ_RESET record @24: r_offset=24+12. Precise named STT_FUNC symbols,
      # never section+addend (A3.4).
      - Offset: 0x24
        Type: R_MCS251_ISR_REF
        Symbol: __mcs251_reset
        Addend: 0
  # v2 identity carrier (A4 design 3.1/3.2): exactly one
  # .mcs251.attributes, SHT 0x70000003, align 1, non-ALLOC, entsize/link/info
  # 0, 172-byte production payload (byte-exact llc XSmall emission, the
  # same frozen bytes as lld/test/MCS251/v2-object-identity.test xs.yaml,
  # re-verified against a live llc -filetype=obj emission).
  # NO v1 .note.mcs251.abi may appear in this object (3.2: v2 must not
  # carry a note that would mislead old readers).
  - Name: .mcs251.attributes
    Type: 0x70000003
    AddressAlign: 1
    Content: ''

Symbols:
  # Reset entry: named STT_FUNC in executable PROGBITS so the IRQ_RESET record
  # association points at a precise in-object function of range 3 (A3.4).
  - Name: __mcs251_reset
    Type: STT_FUNC
    Binding: STB_GLOBAL
    Section: .mcs251.HOME
    Value: 0x0
    Size: 3
  # IRQ default fail-stop entry: STT_FUNC size 4 (A5); no relocation may fall
  # inside [0x102,0x106); checked byte-exactly by check-crt-irq.py.
  - Name: __mcs251_isr_unhandled
    Type: STT_FUNC
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x102
    Size: 4
  # BOOT entry (HOME J16 target) and XINIT walker (keeps the SPEC 6.2
  # __mcs251_globals_init-defined validation trigger of the v1 chain).
  - Name: __mcs251_selfstart_boot
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x0
  - Name: __mcs251_globals_init
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x4A
  # XDATA_INIT walker entry (X4), ECALLed between globals_init and _main.
  - Name: __mcs251_xdata_init
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0xA0
  # Local labels mirroring the frozen walker asset (crt-selfstart.lst) and
  # the X4 walker asset (crt-xdata-init-walker.asm).
  - Name: __mcs251_halt
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x48
  - Name: __mcs251_xinit_record
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x56
  - Name: __mcs251_xinit_clear
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x7A
  - Name: __mcs251_xinit_copy
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x89
  - Name: __mcs251_xinit_done
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x9F
  - Name: __mcs251_xdata_record
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xAC
  - Name: __mcs251_xdata_copy
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xDF
  - Name: __mcs251_xdata_zero
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xF4
  - Name: __mcs251_xdata_done
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x101
  # Undefined globals resolved by lld: module entry, synthesized stack base,
  # synthesized XINIT/XDATA_INIT boundary symbols (SPEC 6.1/6.3; X4).
  - Name: _main
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: __mcs251_stack_base
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: s_XINIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: l_XINIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: s_XDATA_INIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: l_XDATA_INIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
