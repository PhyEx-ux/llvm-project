# crt-selfstart-v2.yaml - v2-identity twin of crt-selfstart.yaml (A4 W7, design 6).
#
# Startup order, vectors (8 VECS fragment pairs), stack initialization, segment
# boundaries, entry and every relocation/symbol are preserved byte-for-byte
# from the frozen v1 fixture crt-selfstart.yaml.  The ONLY changes are the
# object identity:
#   - e_flags 0x00000102 (v2 object protocol; low byte 2 agrees with Tag 4),
#     installed by gen-crt-v2.sh after yaml2obj (yaml2obj registers only the
#     EF_MCS251_ABI_V1 enum word for EM_MCS251, so the YAML below still says
#     EF_MCS251_ABI_V1 and the generator patches ELF header offset 36, the
#     same technique as lld/test/MCS251/v2-object-identity.test setflags.py);
#   - the v1 .note.mcs251.abi is REPLACED by exactly one .mcs251.attributes
#     carrier (172 bytes, byte-exact llc XSmall production emission; A4 W2).
# A v2 object must never also carry the v1 note (design 3.2/4.2: neither
# identity is repaired from the other; lld rejects both the mix and the
# doubled carrier).  Checked byte-exactly by check-crt-v2.py.
#
# The v1 assets (crt-selfstart.yaml, crt.o) stay frozen and untouched.
# Build with gen-crt-v2.sh --identity v2 (caller-supplied frozen
# yaml2obj/llvm-readobj, explicit --out; never writes into the repository).
--- !ELF
FileHeader:
  Class: ELFCLASS32
  Data: ELFDATA2MSB
  Type: ET_REL
  Machine: EM_MCS251
  Flags: [ EF_MCS251_ABI_V1 ]
Sections:
  # HOME: reset trampoline. ljmp __mcs251_selfstart_boot (3 bytes).
  - Name: .mcs251.HOME
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '020000'
  # VECS: 8 x { 4-byte ejmp default net, 4-byte NOBITS hole } per SPEC 4.3.
  # Fragment pairs must alternate in section-header order.
  - Name: .mcs251.VECS.0.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.0.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  - Name: .mcs251.VECS.1.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.1.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  - Name: .mcs251.VECS.2.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.2.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  - Name: .mcs251.VECS.3.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.3.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  - Name: .mcs251.VECS.4.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.4.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  - Name: .mcs251.VECS.5.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.5.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  - Name: .mcs251.VECS.6.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.6.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  - Name: .mcs251.VECS.7.bytes
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: '8A000000'
  - Name: .mcs251.VECS.7.hole
    Type: SHT_NOBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Size: 4
  # BOOT: startup flow + XINIT walker + XDATA_INIT walker, 0xD5 bytes.
  # Layout (section-relative offsets):
  #   0x00 mov WTST,#0; 0x03 mov spx,#stack_base (R16 @0x05)
  #   0x07 ecall __mcs251_globals_init (R24 @0x08)  - XINIT walker at 0x18
  #   0x0B ecall __mcs251_xdata_init   (R24 @0x0C)  - XDATA walker at 0x6E
  #   0x0F ecall _main (R24 @0x10); 0x13 mov SBUF,#'S'; 0x16 sjmp halt
  #   0x18 [86B] XINIT walker (frozen .lst image, relocations shifted +4)
  #   0x6E [98B] XDATA_INIT walker (crt-xdata-init-walker.asm gold)
  #   0xD0 mov SBUF,#'!'; 0xD3 sjmp ispin  (__mcs251_isr_unhandled)
  - Name: .mcs251.BOOT
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 1
    Content: ''
  - Name: .rela.mcs251.HOME
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.HOME
    Relocations:
      # ljmp __mcs251_selfstart_boot: 02 [J16]
      - Offset: 0x1
        Type: R_MCS251_J16
        Symbol: __mcs251_selfstart_boot
        Addend: 0
  - Name: .rela.mcs251.VECS.0.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.0.bytes
    Relocations:
      # ejmp __mcs251_isr_unhandled: 8A [addr24]
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.VECS.1.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.1.bytes
    Relocations:
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.VECS.2.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.2.bytes
    Relocations:
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.VECS.3.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.3.bytes
    Relocations:
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.VECS.4.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.4.bytes
    Relocations:
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.VECS.5.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.5.bytes
    Relocations:
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.VECS.6.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.6.bytes
    Relocations:
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.VECS.7.bytes
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.VECS.7.bytes
    Relocations:
      - Offset: 0x1
        Type: R_MCS251_24
        Symbol: __mcs251_isr_unhandled
        Addend: 0
  - Name: .rela.mcs251.BOOT
    Type: SHT_RELA
    Link: .symtab
    Info: .mcs251.BOOT
    Relocations:
      # mov spx,#__mcs251_stack_base: 7E F8 [imm16]; lld synthesizes the ABS
      # stack base (SPEC 6.3) because this object carries the UNDEF request.
      - Offset: 0x5
        Type: R_MCS251_16
        Symbol: __mcs251_stack_base
        Addend: 0
      # ecall __mcs251_globals_init: 9A [addr24]
      - Offset: 0x8
        Type: R_MCS251_24
        Symbol: __mcs251_globals_init
        Addend: 0
      # ecall __mcs251_xdata_init (X4): 9A [addr24]
      - Offset: 0xC
        Type: R_MCS251_24
        Symbol: __mcs251_xdata_init
        Addend: 0
      # ecall _main: 9A [addr24]
      - Offset: 0x10
        Type: R_MCS251_24
        Symbol: _main
        Addend: 0
      # mov wr8,#<s_XINIT mid/lo>: 7E 08 [MID8] [LO8] (hand-coded .db prologue)
      - Offset: 0x1A
        Type: R_MCS251_MID8
        Symbol: s_XINIT
        Addend: 0
      - Offset: 0x1B
        Type: R_MCS251_LO8
        Symbol: s_XINIT
        Addend: 0
      # mov r12,#<s_XINIT hi>: 7A 0C 00 [HI8] (dr0 24-bit bank byte)
      - Offset: 0x1F
        Type: R_MCS251_HI8
        Symbol: s_XINIT
        Addend: 0
      # mov wr4,#l_XINIT: 7E 24 [imm16]
      - Offset: 0x22
        Type: R_MCS251_16
        Symbol: l_XINIT
        Addend: 0
      # XDATA_INIT walker prologue (crt-xdata-init-walker.asm, walker at 0x6E):
      # mov dr0[15:0],#<s_XDATA_INIT window>: 7E 08 [MID8] [LO8]
      - Offset: 0x70
        Type: R_MCS251_MID8
        Symbol: s_XDATA_INIT
        Addend: 0
      - Offset: 0x71
        Type: R_MCS251_LO8
        Symbol: s_XDATA_INIT
        Addend: 0
      # mov dr0[31:16],#0x00<bank>: 7A 0C 00 [HI8]
      - Offset: 0x75
        Type: R_MCS251_HI8
        Symbol: s_XDATA_INIT
        Addend: 0
      # mov wr4,#l_XDATA_INIT: 7E 24 [imm16]
      - Offset: 0x78
        Type: R_MCS251_16
        Symbol: l_XDATA_INIT
        Addend: 0
  # v2 identity carrier (A4 design 3.1/3.2): exactly one
  # .mcs251.attributes, SHT 0x70000003, align 1, non-ALLOC, entsize/link/info
  # 0, 172-byte production payload (byte-exact llc XSmall emission, the
  # same frozen bytes as lld/test/MCS251/v2-object-identity.test xs.yaml,
  # re-verified against a live llc -filetype=obj emission).
  # NO v1 .note.mcs251.abi may appear in this object (3.2: v2 must not
  # carry a note that would mislead old readers).
  - Name: .mcs251.attributes
    Type: 0x70000003
    AddressAlign: 1
    Content: ''

Symbols:
  # Locals (crt .lst single-colon labels; NOTYPE mirrors the typeless .rel asset).
  - Name: __mcs251_reset
    Type: STT_NOTYPE
    Section: .mcs251.HOME
    Value: 0x0
  - Name: __mcs251_halt
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x16
  - Name: __mcs251_xinit_record
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x24
  - Name: __mcs251_xinit_clear
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x48
  - Name: __mcs251_xinit_copy
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x57
  - Name: __mcs251_xinit_done
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x6D
  - Name: __mcs251_xdata_record
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0x7A
  - Name: __mcs251_xdata_copy
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xAD
  - Name: __mcs251_xdata_zero
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xC2
  - Name: __mcs251_xdata_done
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xCF
  - Name: __mcs251_ispin
    Type: STT_NOTYPE
    Section: .mcs251.BOOT
    Value: 0xD3
  # Globals defined here (old .globl / :: labels).
  - Name: __mcs251_selfstart_boot
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x0
  - Name: __mcs251_globals_init
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x18
  - Name: __mcs251_xdata_init
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0x6E
  - Name: __mcs251_isr_unhandled
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
    Section: .mcs251.BOOT
    Value: 0xD0
  # Undefined globals resolved by lld: module entry, synthesized stack base,
  # synthesized XINIT/XDATA_INIT boundary symbols (SPEC 6.1/6.3; X4).
  - Name: _main
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: __mcs251_stack_base
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: s_XINIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: l_XINIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: s_XDATA_INIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
  - Name: l_XDATA_INIT
    Type: STT_NOTYPE
    Binding: STB_GLOBAL
